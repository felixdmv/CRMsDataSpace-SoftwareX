    <text x="632" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Construye clausulas de consulta Solr</text>
  </g>
  <!-- Node: 4. Solr Database -->
  <g filter="url(#shadow)">
