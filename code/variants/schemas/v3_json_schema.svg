    <text x="972.0" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">LLM (responseSchema)</text>
    <text x="902" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Strict NLG Response Out</text>
    <text x="902" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Fuerza output con responseSchema</text>
    <text x="902" y="427" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Campos: respuesta, hallazgos_clave, fuentes</text>
    <text x="902" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Garantiza estructura 100% parseable</text>
  </g>
  <!-- Node: 6. Final Output -->
