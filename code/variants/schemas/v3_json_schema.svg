    <rect x="426.0" y="106" width="136.0" height="18" rx="4" ry="4" fill="#1E293B" />
    <text x="432.0" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">LLM (responseSchema)</text>
    <text x="362" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Strict NLU JSON Out</text>
    <text x="362" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Fuerza parsing via responseSchema</text>
    <text x="362" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Especifica campos exactos de filtros</text>
    <text x="362" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Token-level validation en la API</text>
  </g>
