    <rect x="727.0" y="346" width="105.0" height="18" rx="4" ry="4" fill="#1E293B" />
    <text x="733.0" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Chat / Frontend</text>
    <text x="632" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Dynamic UI Mapping</text>
    <text x="632" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Extrae campos del JSON tipado</text>
    <text x="632" y="427" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Carga datos directos en tablas/tarjetas</text>
  </g>
