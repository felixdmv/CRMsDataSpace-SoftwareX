    <text x="902" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Database Retrieval</text>
    <text x="902" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Ejecuta busqueda estructurada</text>
    <text x="902" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Retorna listado JSON de sitios CRM</text>
  </g>
  <!-- Node: 5. Schema-Enforced NLG -->
  <g filter="url(#shadow)">
    <rect x="890" y="340" width="220" height="110" rx="10" ry="10" fill="#FFFFFF" stroke="#3730A3" stroke-width="2" />
    <path d="M 900 340 L 1100 340 A 10 10 0 0 1 1110 350 L 1110 372 L 890 372 L 890 350 A 10 10 0 0 1 900 340 Z" fill="#4F46E5" />
