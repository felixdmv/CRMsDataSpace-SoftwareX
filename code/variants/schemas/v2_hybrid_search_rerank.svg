  <path d="M 510 155 L 510.3363510410144 164.994341798098 L 501.5128216292497 160.2884594451568 Z" fill="#94A3B8" />
  <text x="490.0" y="187.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">Filters JSON</text>
  <line x1="470" y1="320" x2="510" y2="395" stroke="#06B6D4" stroke-width="2" />
  <path d="M 510 395 L 501.5128216292497 389.71154055484317 L 510.3363510410144 385.005658201902 Z" fill="#06B6D4" />
  <text x="490.0" y="352.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">Text + needs_rag=True</text>
  <line x1="710" y1="395" x2="750" y2="395" stroke="#94A3B8" stroke-width="2" />
  <path d="M 750 395 L 741.3397459621556 400.0 L 741.3397459621556 390.0 Z" fill="#94A3B8" />
  <text x="730.0" y="390.0" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">10 Raw Chunks</text>
  <line x1="850" y1="340" x2="850" y2="210" stroke="#D97706" stroke-width="2" />
  <path d="M 850 210 L 855.0 218.6602540378444 L 845.0 218.6602540378444 Z" fill="#D97706" />
  <text x="850.0" y="270.0" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">Top 3 Curated Chunks</text>
  <line x1="710" y1="155" x2="750" y2="155" stroke="#94A3B8" stroke-width="2" />
  <path d="M 750 155 L 741.3397459621556 160.0 L 741.3397459621556 150.0 Z" fill="#94A3B8" />
  <text x="730.0" y="150.0" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">WARM Sites JSON</text>
  <line x1="950" y1="155" x2="990" y2="230" stroke="#94A3B8" stroke-width="2" />
  <path d="M 990 230 L 981.5128216292497 224.7115405548432 L 990.3363510410144 220.005658201902 Z" fill="#94A3B8" />
  <text x="970.0" y="187.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">Response Context</text>
  <path d="M 950 395 Q 1022.5 312.5 1095 330" fill="none" stroke="#94A3B8" stroke-width="2" />
  <path d="M 1095 330 L 1085.5063279776828 333.14168609709327 L 1087.5323840180422 323.34908190202225 Z" fill="#94A3B8" />
  <text x="1022.5" y="332.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">Source Evidence Metadata</text>
</svg>