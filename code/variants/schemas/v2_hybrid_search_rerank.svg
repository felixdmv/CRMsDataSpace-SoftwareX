<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 550" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CBD5E1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#dotGrid)" />
  <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">VARIANTE 2: HYBRID SEARCH & CONTEXT CURATION</text>
  <!-- Node: 1. User Query -->
  <g filter="url(#shadow)">
    <rect x="50" y="220" width="180" height="110" rx="10" ry="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
    <path d="M 60 220 L 220 220 A 10 10 0 0 1 230 230 L 230 252 L 50 252 L 50 230 A 10 10 0 0 1 60 220 Z" fill="#64748B" />
    <text x="62" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">1. User Query</text>
    <rect x="154.2" y="226" width="67.80000000000001" height="18" rx="4" ry="4" fill="#1E293B" />
    <text x="160.2" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">NL String</text>
    <text x="62" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">NL Query Input</text>
    <text x="62" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• e.g. '¿Qué dice el informe de'</text>
    <text x="62" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Penouta sobre la estabilidad?'</text>
  </g>
  <!-- Node: 2. NLU Parser -->
  <g filter="url(#shadow)">
    <rect x="270" y="220" width="200" height="110" rx="10" ry="10" fill="#FFFFFF" stroke="#3730A3" stroke-width="2" />
    <path d="M 280 220 L 460 220 A 10 10 0 0 1 470 230 L 470 252 L 270 252 L 270 230 A 10 10 0 0 1 280 220 Z" fill="#4F46E5" />
    <text x="282" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">2. NLU Parser</text>
    <rect x="388.0" y="226" width="74.0" height="18" rx="4" ry="4" fill="#1E293B" />
    <text x="394.0" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">LLM Parser</text>
    <text x="282" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Intent & Filter Extraction</text>
    <text x="282" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Procesa y clasifica intencion</text>
    <text x="282" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Detecta si requiere RAG (needs_rag)</text>
    <text x="282" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• O activa por palabras clave de PDF</text>
  </g>
  <!-- Node: 3A. Solr DB Query -->
  <g filter="url(#shadow)">
    <rect x="510" y="100" width="200" height="110" rx="10" ry="10" fill="#FFFFFF" stroke="#065F46" stroke-width="2" />
    <path d="M 520 100 L 700 100 A 10 10 0 0 1 710 110 L 710 132 L 510 132 L 510 110 A 10 10 0 0 1 520 100 Z" fill="#059669" />
    <text x="522" y="121" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">3A. Solr DB Query</text>
    <rect x="621.8" y="106" width="80.2" height="18" rx="4" ry="4" fill="#1E293B" />
    <text x="627.8" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Apache Solr</text>
    <text x="522" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Structured Search</text>
    <text x="522" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Busca metadatos de sitios</text>
    <text x="522" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Filtra por region/mineral/etc</text>
    <text x="522" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Retorna registros WARM</text>
  </g>
  <!-- Node: 3B. FAISS Vector Search -->
  <g filter="url(#shadow)">
    <rect x="510" y="340" width="200" height="110" rx="10" ry="10" fill="#FFFFFF" stroke="#155E75" stroke-width="2" />
    <path d="M 520 340 L 700 340 A 10 10 0 0 1 710 350 L 710 372 L 510 372 L 510 350 A 10 10 0 0 1 520 340 Z" fill="#0891B2" />
    <text x="522" y="361" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">3B. FAISS Vector Search</text>
    <rect x="621.8" y="346" width="80.2" height="18" rx="4" ry="4" fill="#1E293B" />
    <text x="627.8" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">FAISS Index</text>
    <text x="522" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Semantic Search on PDFs</text>
    <text x="522" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Embedding de query local</text>
    <text x="522" y="427" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Busca en indices de textos PDF</text>
    <text x="522" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Retorna K=10 fragmentos crudos</text>
  </g>
  <!-- Node: 4. Reranker & Curator -->
  <g filter="url(#shadow)">
    <rect x="750" y="340" width="200" height="110" rx="10" ry="10" fill="#FFFFFF" stroke="#92400E" stroke-width="2" />
    <path d="M 760 340 L 940 340 A 10 10 0 0 1 950 350 L 950 372 L 750 372 L 750 350 A 10 10 0 0 1 760 340 Z" fill="#D97706" />
    <text x="762" y="361" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">4. Reranker & Curator</text>
    <rect x="855.6" y="346" width="86.4" height="18" rx="4" ry="4" fill="#1E293B" />
    <text x="861.6" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Python Logic</text>
    <text x="762" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Context Density Filter</text>
    <text x="762" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Filtra por similitud (score &gt;= 0.15)</text>
    <text x="762" y="427" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Ordena por relevancia desc</text>
    <text x="762" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Elige Top 3 parrafos de alta densidad</text>
  </g>
  <!-- Node: 5. Hybrid NLG Synthesizer -->
  <g filter="url(#shadow)">
    <rect x="750" y="100" width="200" height="110" rx="10" ry="10" fill="#FFFFFF" stroke="#3730A3" stroke-width="2" />
    <path d="M 760 100 L 940 100 A 10 10 0 0 1 950 110 L 950 132 L 750 132 L 750 110 A 10 10 0 0 1 760 100 Z" fill="#4F46E5" />
    <text x="762" y="121" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">5. Hybrid NLG Synthesizer</text>
    <rect x="812.2" y="106" width="129.8" height="18" rx="4" ry="4" fill="#1E293B" />
    <text x="818.2" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">LLM (OpenAI/Gemini)</text>
    <text x="762" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Narrative Fusion</text>
    <text x="762" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Fusiona registros DB + PDFs curados</text>
    <text x="762" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Evita alucinaciones y ruido</text>
    <text x="762" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Localiza sintesis en castellano</text>
  </g>
  <!-- Node: 6. Final Output -->
  <g filter="url(#shadow)">
    <rect x="990" y="220" width="210" height="110" rx="10" ry="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" />
    <path d="M 1000 220 L 1190 220 A 10 10 0 0 1 1200 230 L 1200 252 L 990 252 L 990 230 A 10 10 0 0 1 1000 220 Z" fill="#64748B" />
    <text x="1002" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">6. Final Output</text>
    <rect x="1099.4" y="226" width="92.60000000000001" height="18" rx="4" ry="4" fill="#1E293B" />
    <text x="1105.4" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Chat / Gradio</text>
    <text x="1002" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Structured UI Display</text>
    <text x="1002" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Pinta respuesta con citas</text>
    <text x="1002" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Mapea fragmentos como 'evidencias'</text>
    <text x="1002" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Muestra paginas/scores de origen</text>
  </g>
